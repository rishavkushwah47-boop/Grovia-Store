<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Grovia Store - 10 Min Delivery</title>
<!-- CSS FILE LINK -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-top">
    <!-- YAHAN AAPKA LOGO LAGEGA -->
    <div class="logo-container">
      <img src="grovia-logo.png" alt="Grovia Store" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <!-- Agar image na mile toh fallback text dikhega -->
      <h2 style="display:none; color:var(--primary); font-weight:900; font-size:24px; letter-spacing:-1px;">Grovia</h2>
    </div>

    <div class="delivery-info">
      <div class="delivery-time">⚡ 10 mins</div>
      <div class="delivery-loc">📍 Sector 21, Noida ▾</div>
    </div>
  </div>

  <!-- SEARCH -->
  <div class="search-wrap">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search for milk, bread, chips...">
    </div>
  </div>

  <!-- CATEGORIES -->
  <div class="categories" id="categories">
    <!-- JS will populate this -->
  </div>
</header>

<!-- MAIN CONTENT -->
<main>
  <div class="section-title" id="sectionTitle">Daily Essentials ⚡</div>
  <div class="grid" id="productGrid"></div>
</main>

<!-- FLOATING CART -->
<div class="floating-cart" id="floatingCart">
  <div class="cart-info">
    <span id="cartItemCount">2 items</span>
    <span id="cartTotalPrice">₹120</span>
  </div>
  <button class="view-cart-btn">View Cart ▸</button>
</div>

<!-- CART DRAWER -->
<div class="overlay" id="overlay"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="drawer-header">
    <h3>My Cart</h3>
    <button class="close-drawer" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="cartItemsList">
    <!-- JS will populate this -->
  </div>
  <div class="drawer-footer">
    <div class="bill-row">
      <span>Total Bill</span>
      <span id="drawerTotal">₹0</span>
    </div>
    <button class="checkout-btn" id="checkoutBtn">Proceed to Pay</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">Item added to cart</div>

<!-- JS FILE LINK -->
<script src="script.js"></script>
</body>
</html>
