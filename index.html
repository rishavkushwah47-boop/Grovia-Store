<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Navigation Bar -->
    <header class="navbar">
        <div class="logo">blinkit</div>
        
        <div class="delivery-info">
            <span class="time">Delivery in 10 minutes</span>
            <span class="location">Etawah, Uttar Pradesh ▼</span>
        </div>
        
        <div class="search-bar">
            <input type="text" placeholder="Search for groceries, vegetables...">
        </div>
        
        <div class="cart-btn">
            <button>🛒 My Cart</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main>
        <!-- Promotional Banner -->
        <section class="banner">
            <h2>Superfast Delivery To Your Doorstep</h2>
        </section>

        <!-- Product Grid Section -->
        <section class="products-section">
            <h3>Dairy & Essentials</h3>
            <div class="grid-container">
                
                <!-- Product Card 1 -->
                <div class="card">
                    <div class="img-placeholder">Product Image</div>
                    <h4>Fresh Milk (Toned)</h4>
                    <p>500 ml</p>
                    <div class="price-add">
                        <span>₹32</span>
                        <button class="add-btn">ADD</button>
                    </div>
                </div>

                <!-- Product Card 2 -->
                <div class="card">
                    <div class="img-placeholder">Product Image</div>
                    <h4>White Bread</h4>
                    <p>1 packet</p>
                    <div class="price-add">
                        <span>₹40</span>
                        <button class="add-btn">ADD</button>
                    </div>
                </div>

                <!-- Product Card 3 -->
                <div class="card">
                    <div class="img-placeholder">Product Image</div>
                    <h4>Fresh Tomatoes</h4>
                    <p>1 kg</p>
                    <div class="price-add">
                        <span>₹60</span>
                        <button class="add-btn">ADD</button>
                    </div>
                </div>

                <!-- Product Card 4 -->
                <div class="card">
                    <div class="img-placeholder">Product Image</div>
                    <h4>Potato (Aloo)</h4>
                    <p>1 kg</p>
                    <div class="price-add">
                        <span>₹35</span>
                        <button class="add-btn">ADD</button>
                    </div>
                </div>

            </div>
        </section>
    </main>
</body>
                          </html>
